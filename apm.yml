name: zettel
version: 0.1.0
description: Zettel agent-config — skills via the apm marketplace
targets:
  - claude
  - codex
includes: auto          # deploys any Zettel-local .apm/skills/ last (local wins collisions)
dependencies:
  apm:
    - AlexW00/apm/packages/ios-core
    - AlexW00/apm/packages/ios-ship
    - AlexW00/apm/packages/design-eng
  mcp:
    - name: apple-docs-mcp
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@kimsungwhee/apple-docs-mcp@1.0.26'
    - name: xcode
      registry: false
      transport: stdio
      command: xcrun
      args:
        - mcpbridge
